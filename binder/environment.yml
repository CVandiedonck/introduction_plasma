name: introduction_plasma_2026
# d'après github.com/CVandiedonck/introduction_plasma.git
# avec ajouts depuis github.com/Scaburet/MEG-M1-A2B-2026
# Variante nettoyée (oct. 2026) : versions volontairement non fixées,
# à figer une fois l'environnement validé sur uracile/adenine.

# channels priority
# see https://bioconda.github.io/
# conda-forge has highest priority
channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Jupyter dependencies
  # jupyterhub doit rester compatible avec la version du hub PlasmaBio
  - jupyterhub>=4.1.6,<5
  - jupyterlab>=4.4,<5
  - notebook>=7,<8
  - jupyter_server>=2,<3
  # borne conservée : semblait nécessaire pour que l'env se construise
  - jupyter-server-proxy>=4.1,<4.2
  - jupyter-resource-usage
  - jupyterlab-topbar-text # affiche le nom de l'environnement à droite dans la topbar
  - nodejs

  # Jupyter archive
  # https://github.com/jupyterlab-contrib/jupyter-archive
  - jupyter-archive

  # JupyterLab git
  # https://github.com/jupyterlab/jupyterlab-git
  - jupyterlab-git

  # JupyterLab Variable inspector
  # https://github.com/lckr/jupyterlab-variableInspector
  - jupyterlab-variableinspector

  # Compilateurs (installation de paquets R/Bioconductor depuis les sources)
  - gcc_linux-64
  - gxx_linux-64
  - gfortran_linux-64
  - libgomp

  # Bash environment
  - bash_kernel

  # Python environment
  - python>=3.10
  - pip
  - ipywidgets>=8,<9
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - biopython

  # R environment
  - r-base>=4
  - r-irkernel
  - r-repr
  # R packages for the M1 A2B course
  - r-tidyverse
  - r-biocmanager

  - pip:
    # Print module version
    - watermark
